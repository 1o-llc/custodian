[package]
name = "custodian"
version = "0.3.2"
edition = "2021"
# ob-serve-a-bowl 0.2 needs 1.88; xccute 0.3.1 (the job lock is std File::try_lock) needs 1.89
rust-version = "1.89"

license = "MIT OR Apache-2.0"
description = "Repository awareness for coding agents before they act: reading specs over a Rust workspace, each run a declared xccute line with a receipt, a SQLite journal, jobs as folders, a resident socket, and the maintenance loop"
keywords = ["klepto", "code-search", "cli", "static-analysis", "maintenance"]
categories = ["development-tools", "command-line-utilities"]

authors = ["James Hunt <james@1o.business>"]
repository = "https://github.com/1o-llc/custodian"
readme = "README.md"

include = ["src/**", "hooks/**", "tests/**", "docs/**", "Cargo.toml", "LICENSE*", "README*", "CHANGELOG*"]

[[bin]]
name = "custodian"
path = "src/main.rs"

[dependencies]
# the library: readings over klepto, held open as a Workspace (src/api.rs)
# 0.1.1: a job's close reads cargo's test outcomes (`FAILED`), the words custodian writes
custodian_kit = { version = "0.3.3", path = "../custodian_kit" }
# a job's records in James Hunt's typed 1o task histories (written through custodian_kit's task_records)
task_history = "0.1.0"
# the receipts journal custodian's tables sit beside; the counts over time and their tables; every kind of history
# side by side (what `count history` answers from)
receipt_history = "0.1.0"
tree_history = "0.1.0"
differences_kit = "0.1.1"
# the checks and the timing report, run as maintenance's own declared lines
maintenance = { version = "0.1.0", features = ["check", "runner"] }

# every subcommand a declared line; every run executed through the runtime with a receipt
simple_impl_derive = "0.2.7"
xccute_contract = "0.1.3"
xccute_runtime = "0.1.2"
# a job held under the workspace's job lock (`Hold` over a `LockFile`), every wait from one timing table
xccute = "0.3.1"
# the cargo test lines (nothing redeclared)
xccute_commands = "0.1.1"
# the gates a run asks before it acts: same search, a job running, a triage step's input
xccute_decisions = "0.2.1"
# the journal's sequence: a checked counter
uh-tom-mick = "0.1.1"
# every digest, over one canonical byte form
stable_digest = "0.1.1"
# the .custodian/ layout, declared by derive
pathgen = { version = "0.1.2", features = ["derive"] }
pathgen-macros = "0.1.2"
# the job queue with QoS and checkpoints, the observers
waker_protocol = "0.3.2"
waker_tables = "0.3.1"
ob-serve-a-bowl = "0.2.2"
# the resident socket: owner-only, length-prefixed frames
mine = "0.3.2"
abut = "0.2.2"
# option sets as words, their rules as constraints, refusals as codes
big-bad-bool = "0.1.1"
flaga_solver = "0.1.1"
liaise_proc_macro = "0.1.3"
# self install: plan, install from the plan, receipt
installation = "0.2.2"
# the journal
rusqlite = { version = "0.40", features = ["bundled"] }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }

# `custodian mcp serve`: the lines as MCP tools, on the official Rust SDK over stdio
rmcp = { version = "3.5.1", optional = true, default-features = false, features = ["server", "transport-io"] }
tokio = { version = "1", optional = true, features = ["rt", "sync"] }

# differences_kit takes the folder's layout from custodian_kit: the one beside this crate, so there is one custodian_kit
[patch.crates-io]
custodian_kit = { path = "../custodian_kit" }

[features]
default = ["mcp"]
mcp = ["dep:rmcp", "dep:tokio"]

[dev-dependencies]
# the tests' MCP client, in process and over the built program's stdio
rmcp = { version = "3.5.1", default-features = false, features = ["client", "server", "transport-io"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "io-util", "time"] }
